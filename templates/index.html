<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face Recognition Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg-dark text-light">

    <nav class="navbar navbar-dark bg-secondary bg-opacity-10 border-bottom border-secondary py-3">
        <div class="container-fluid px-4">
            <span class="navbar-brand fw-bold fs-4 d-flex align-items-center gap-2">
                <i class="fa-solid fa-camera-retro me-2 text-primary"></i> FaceRec Studio
            </span>
            <span class="badge bg-success-subtle text-success border border-success-subtle rounded-pill px-3 py-2" id="systemStatus">
                <i class="fa-solid fa-circle me-1 small"></i> System Ready
            </span>
        </div>
    </nav>

    <div class="container-fluid px-4 py-4">
        <div class="row g-4">

            <div class="col-lg-4">
                <div class="card glass-card h-100 p-4">
                    <h5 class="fw-bold mb-4 border-bottom border-secondary pb-3 text-primary">
                        <i class="fa-solid fa-sliders me-2"></i> Control Panel
                    </h5>

                    <div class="mb-4">
                        <label class="form-label text-secondary small fw-semibold">DATA COLLECTION</label>
                        <div class="input-group mb-2">
                            <span class="input-group-text bg-dark text-secondary border-secondary"><i class="fa-solid fa-user"></i></span>
                            <input type="text" id="userNameInput" class="form-control bg-dark text-white border-secondary" placeholder="Enter Full Name">
                        </div>
                        <button class="btn btn-primary w-100 fw-semibold" onclick="startCollect()">
                            <i class="fa-solid fa-camera me-2"></i> Collect Face Samples
                        </button>
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-secondary small fw-semibold">MODEL TRAINING</label>
                        <button class="btn btn-warning w-100 text-dark fw-bold" onclick="startTrain()">
                            <i class="fa-solid fa-brain me-2"></i> Train Recognition Model
                        </button>
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-secondary small fw-semibold">RECOGNITION & CONTROLS</label>
                        <div class="d-grid gap-2">
                            <button class="btn btn-success fw-semibold" onclick="startRecognize()">
                                <i class="fa-solid fa-play me-2"></i> Launch Live Recognizer
                            </button>
                            <button class="btn btn-danger fw-semibold" onclick="stopSystem()">
                                <i class="fa-solid fa-square me-2"></i> Stop System
                            </button>
                        </div>
                    </div>

                    <div class="mt-auto pt-3 border-top border-secondary">
                        <label class="form-label text-secondary small fw-semibold">CONSOLE FEEDBACK</label>
                        <div id="logOutput" class="bg-black bg-opacity-50 p-3 rounded font-monospace small text-info border border-secondary" style="min-height: 80px;">
                            > System initialized. Ready for operations.
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-lg-8 d-flex flex-column gap-4">
                <div class="card glass-card p-4 text-center">
                    <div class="d-flex justify-content-between align-items-center w-100 mb-3">
                        <h5 class="fw-bold mb-0 text-secondary">
                            <i class="fa-solid fa-video me-2"></i> Live Video Stream Viewport
                        </h5>
                        <div class="bg-dark border border-secondary rounded-pill px-3 py-1 d-flex align-items-center gap-2">
                            <i class="fa-solid fa-user-check text-primary"></i>
                            <span class="small text-secondary fw-semibold text-uppercase">Total Captured:</span>
                            <span id="faceCount" class="badge bg-primary rounded-pill fs-6">0</span>
                        </div>
                    </div>

                    <div class="viewport-box rounded border border-secondary bg-black d-flex align-items-center justify-content-center w-100 position-relative overflow-hidden" style="min-height: 380px;">
                        <img id="videoStream" src="{{ url_for('video_feed') }}" width="100%" height="100%" style="object-fit: cover;" alt="Live Camera Stream">
                    </div>
                </div>

                <div class="card glass-card p-4">
                    <h6 class="fw-bold text-secondary mb-3 d-flex align-items-center justify-content-between">
                        <span><i class="fa-solid fa-clock-rotate-left me-2 text-primary"></i> Captured Faces Log</span>
                        <small class="fw-normal text-muted" style="font-size: 0.75rem;">Updates live during recognition</small>
                    </h6>
                    <div class="table-responsive" style="max-height: 200px; overflow-y: auto;">
                        <table class="table table-dark table-hover table-sm align-middle mb-0">
                            <thead>
                                <tr class="text-secondary small border-secondary">
                                    <th>#</th>
                                    <th>NAME / PERSON</th>
                                    <th>TIME CAPTURED</th>
                                    <th>STATUS</th>
                                </tr>
                            </thead>
                            <tbody id="captureLogTable">
                                <tr>
                                    <td colspan="4" class="text-center text-muted py-3">No faces captured yet. Launch recognition to start logging.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='main.js') }}"></script>
</body>
</html>
